<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字幕生成ツール</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #333;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      background: #f5f7ff;
      border-color: #764ba2;
    }

    .upload-area.dragover {
      background: #f0f4ff;
      border-color: #764ba2;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .upload-text {
      color: #333;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .upload-subtext {
      color: #999;
      font-size: 12px;
    }

    input[type="file"] {
      display: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135px, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      background: #f5f7ff;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #667eea;
      font-weight: 600;
      font-size: 14px;
    }

    .result {
      display: none;
      background: #f5f7ff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .result.active {
      display: block;
    }

    .result-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .result-text {
      background: white;
      padding: 15px;
      border-radius: 6px;
      color: #333;
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
      border-left: 4px solid #667eea;
    }

    .copy-btn {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .copy-btn:hover {
      background: #667eea;
      color: white;
    }

    .error {
      display: none;
      background: #fee;
      border-left: 4px solid #f44;
      padding: 15px;
      border-radius: 6px;
      color: #c33;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .error.active {
      display: block;
    }

    .file-info {
      color: #666;
      font-size: 12px;
      margin-top: 15px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 字幕生成ツール</h1>
    <p class="subtitle">動画をアップロード → 自動で字幕を生成</p>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📱</div>
      <div class="upload-text">動画をここにドラッグ</div>
      <div class="upload-subtext">または クリックして選択</div>
      <input type="file" id="fileInput" accept="video/*,audio/*">
    </div>

    <div class="file-info" id="fileInfo" style="display: none;">
      📁 <span id="fileName"></span>
    </div>

    <div class="button-group">
      <button class="btn-primary" id="submitBtn" disabled>
        生成開始
      </button>
    </div>

    <div class="error" id="error"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">字幕を生成中...</div>
    </div>

    <div class="result" id="result">
      <div class="result-title">📝 生成された字幕</div>
      <div class="result-text" id="resultText"></div>
      <button class="copy-btn" id="copyBtn">コピー</button>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    const resultText = document.getElementById('resultText');
    const copyBtn = document.getElementById('copyBtn');
    const fileInfo = document.getElementById('fileInfo');
    const fileNameSpan = document.getElementById('fileName');

    let selectedFile = null;

    // ファイル選択
    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        fileNameSpan.textContent = selectedFile.name;
        fileInfo.style.display = 'block';
        submitBtn.disabled = false;
      }
    });

    // ドラッグ&ドロップ
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      selectedFile = e.dataTransfer.files[0];
      if (selectedFile) {
        fileNameSpan.textContent = selectedFile.name;
        fileInfo.style.display = 'block';
        submitBtn.disabled = false;
      }
    });

    // 送信
    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      error.classList.remove('active');
      result.classList.remove('active');
      loading.classList.add('active');
      submitBtn.disabled = true;

      try {
        // ファイルを base64 に変換
        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64Data = e.target.result.split(',')[1];

          const response = await fetch('/api/transcribe', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              audioData: base64Data,
              fileName: selectedFile.name,
            }),
          });

          const data = await response.json();

          loading.classList.remove('active');

          if (!response.ok) {
            throw new Error(data.message || 'エラーが発生しました');
          }

          resultText.textContent = data.text;
          result.classList.add('active');
        };
        reader.readAsDataURL(selectedFile);
      } catch (err) {
        loading.classList.remove('active');
        error.textContent = `エラー: ${err.message}`;
        error.classList.add('active');
      } finally {
        submitBtn.disabled = false;
      }
    });

    // コピー
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultText.textContent);
      const original = copyBtn.textContent;
      copyBtn.textContent = '✓ コピーしました';
      setTimeout(() => {
        copyBtn.textContent = original;
      }, 2000);
    });
  </script>
</body>
</html>
